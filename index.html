<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XY PLOTTER //</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            padding: 24px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
            gap: 25px;
            transition: background-color 0.2s ease;
        }

        .controls-top {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        #dev-badge {
            display: none;
            background: #fff;
            color: #000;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #dev-badge.active {
            display: inline-block;
        }

        /* Developer Inspection Panel */
        .dev-cam-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid #fff;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
        }

        .dev-cam-panel.active {
            display: flex;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 0.8rem;
            font-weight: bold;
            gap: 12px;
        }

        .dev-content {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .dev-content.open {
            display: flex;
        }

        .canvas-container {
            position: relative;
            width: 320px;
            height: 240px;
            border: 1px solid #fff;
            overflow: hidden;
        }

        #dev-canvas {
            width: 320px;
            height: 240px;
            display: block;
        }

        /* Crosshair lines */
        .crosshair-h, .crosshair-v {
            position: absolute;
            background: #fff;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        .crosshair-h {
            height: 1px;
            width: 100%;
            top: 50%;
            left: 0;
        }

        .crosshair-v {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
        }

        .file-label {
            background: #fff;
            color: #000;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .dir-btn {
            width: 66px;
            height: 66px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            color: #fff;
            border: 1px solid #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .dir-btn.active {
            background: #fff;
            color: #000;
        }

        .synth-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #fff;
            padding: 10px 18px;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
        }

        select {
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: 1px solid #fff;
            font-family: inherit;
            padding: 4px;
            text-transform: uppercase;
        }

        .scale-display {
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid #fff;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
        }

        .note-card {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .color-indicator {
            width: 14px;
            height: 14px;
            border: 1px solid #fff;
            cursor: pointer;
        }

        .toggle-btn {
            background: transparent;
            color: #fff;
            border: none;
            padding: 0 4px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-left: 6px;
        }

        .toggle-btn:hover {
            color: #aaa;
        }

        .expandable-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #fff;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            margin-top: -15px;
        }

        .expandable-container.open {
            display: flex;
        }

        .grid-header {
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-align: center;
        }

        .stacks-container {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            justify-content: center;
        }

        .hue-stack {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        .color-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .color-square {
            width: 14px;
            height: 14px;
            border: 1px solid #fff;
            transition: transform 0.1s, border-color 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }

        .color-square.active-shade, .color-indicator.active-shade {
            border: 2px solid #000 !important;
            outline: 1px solid #fff;
            transform: scale(1.4);
            box-shadow: 0 0 10px #000;
        }
    </style>
</head>
<body>

    <div class="controls-top">
        <button id="connect-btn" onclick="connect()">CONNECT USB</button>
        <span id="status">STATUS: DISCONNECTED</span>
        <span id="dev-badge">DEV MODE: ACTIVE</span>
    </div>

    <!-- Collapsible Developer Inspector Panel -->
    <div class="dev-cam-panel" id="dev-cam-panel">
        <div class="panel-header">
            <span>TEST</span>
            <button class="toggle-btn" onclick="toggleWebcamDrawer()">▼</button>
        </div>
        <div class="dev-content" id="dev-drawer">
            <div class="canvas-container" id="canvas-wrap">
                <canvas id="dev-canvas" width="320" height="240"></canvas>
                <div class="crosshair-h" id="cross-h"></div>
                <div class="crosshair-v" id="cross-v"></div>
            </div>
            <label class="file-label">
                UPLOAD IMAGE
                <input type="file" id="img-upload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
            </label>
            <video id="dev-video" autoplay playsinline style="display:none;"></video>
        </div>
    </div>

    <div class="dpad">
        <div class="row">
            <button id="w" class="dir-btn">W</button>
        </div>
        <div class="row">
            <button id="a" class="dir-btn">A</button>
            <button id="s" class="dir-btn">S</button>
            <button id="d" class="dir-btn">D</button>
        </div>
    </div>

    <div class="synth-bar">
        <span>AUDIO:</span>
        <select id="wave-type" onchange="updateWaveform()">
            <option value="sine">SINE</option>
            <option value="square" selected>SQUARE</option>
            <option value="sawtooth">SAW</option>
            <option value="triangle">TRI</option>
        </select>

        <span>SCALE:</span>
        <select id="scale-type" onchange="updateScaleLabels()">
            <option value="minor">MINOR PENTA (A)</option>
            <option value="major">MAJOR PENTA (C)</option>
            <option value="egyptian">EGYPTIAN</option>
            <option value="blues">BLUES PENTA</option>
        </select>
    </div>

    <div class="scale-display">
        <div class="note-card">
            <div class="color-indicator" id="top-sq-0" style="background:#d63651;" onclick="devSelectColor(214, 54, 81)"></div>
            <span>R: <span id="top-label-0">A2</span></span>
        </div>
        <div class="note-card">
            <div class="color-indicator" id="top-sq-1" style="background:#d6b636;" onclick="devSelectColor(214, 182, 54)"></div>
            <span>Y: <span id="top-label-1">A3</span></span>
        </div>
        <div class="note-card">
            <div class="color-indicator" id="top-sq-2" style="background:#36d65b;" onclick="devSelectColor(54, 214, 91)"></div>
            <span>G: <span id="top-label-2">A4</span></span>
        </div>
        <div class="note-card">
            <div class="color-indicator" id="top-sq-3" style="background:#36d6d6;" onclick="devSelectColor(54, 214, 214)"></div>
            <span>C: <span id="top-label-3">A5</span></span>
        </div>
        <div class="note-card">
            <div class="color-indicator" id="top-sq-4" style="background:#365bd6;" onclick="devSelectColor(54, 91, 214)"></div>
            <span>B: <span id="top-label-4">D5</span></span>
        </div>
        <button class="toggle-btn" onclick="toggleSpectrum()">▼</button>
    </div>

    <div class="expandable-container" id="spectrum-drawer">
        <div class="grid-header">COLOUR TO SOUND</div>
        <div class="stacks-container" id="main-color-stacks"></div>
    </div>

<script>

let audioCtx = null;
const activeNotes = {};

let camOsc = null;
let camGain = null;
let devMode = false;
let webcamActive = false;
let uploadedImage = null;
let devStream = null;

let crosshairX = 160;
let crosshairY = 120;
const STEP_SPEED = 3;

const WASD_SCALES = {

        [{freq:220.00,note:"A3"}, {freq:261.63,note:"C4"}, {freq:293.66,note:"D4"}, {freq:329.63,note:"E4"}, {freq:392.00,note:"G4"}],

        [{freq:440.00,note:"A4"}, {freq:523.25,note:"C5"}, {freq:587.33,note:"D5"}, {freq:659.25,note:"E5"}, {freq:783.99,note:"G5"}],
        [{freq:587.33,note:"D5"}, {freq:659.25,note:"E5"}, {freq:783.99,note:"G5"}, {freq:880.00,note:"A5"}, {freq:1046.5,note:"C6"}],

        [{freq:1318.5,note:"E6"}, {freq:1567.9,note:"G6"}, {freq:1760.0,note:"A6"}, {freq:2093.0,note:"C7"}, {freq:2349.3,note:"D7"}]
    ],
    major: [
        [{freq:130.81,note:"C3"}, {freq:146.83,note:"D3"}, {freq:164.81,note:"E3"}, {freq:196.00,note:"G3"}, {freq:220.00,note:"A3"}],

        [{freq:261.63,note:"C4"}, {freq:293.66,note:"D4"}, {freq:329.63,note:"E4"}, {freq:392.00,note:"G4"}, {freq:440.00,note:"A4"}],

        [{freq:523.25,note:"C5"}, {freq:587.33,note:"D5"}, {freq:659.25,note:"E5"}, {freq:783.99,note:"G5"}, {freq:880.00,note:"A5"}],
        [{freq:783.99,note:"G5"}, {freq:880.00,note:"A5"}, {freq:1046.5,note:"C6"}, {freq:1174.6,note:"D6"}, {freq:1318.5,note:"E6"}],
        [{freq:1046.5,note:"C6"}, {freq:1174.6,note:"D6"}, {freq:1318.5,note:"E6"}, {freq:1567.9,note:"G6"}, {freq:1760.0,note:"A6"}],
        [{freq:1567.9,note:"G6"}, {freq:1760.0,note:"A6"}, {freq:2093.0,note:"C7"}, {freq:2349.3,note:"D7"}, {freq:2637.0,note:"E7"}]
    ],
    egyptian: [
        [{freq:146.83,note:"D3"}, {freq:164.81,note:"E3"}, {freq:196.00,note:"G3"}, {freq:220.00,note:"A3"}, {freq:261.63,note:"C4"}],

        [{freq:293.66,note:"D4"}, {freq:329.63,note:"E4"}, {freq:392.00,note:"G4"}, {freq:440.00,note:"A4"}, {freq:523.25,note:"C5"}],
        [{freq:440.00,note:"A4"}, {freq:523.25,note:"C5"}, {freq:587.33,note:"D5"}, {freq:659.25,note:"E5"}, {freq:783.99,note:"G5"}],
        [{freq:587.33,note:"D5"}, {freq:659.25,note:"E5"}, {freq:783.99,note:"G5"}, {freq:880.00,note:"A5"}, {freq:1046.5,note:"C6"}],
        [{freq:880.00,note:"A5"}, {freq:1046.5,note:"C6"}, {freq:1174.6,note:"D6"}, {freq:1318.5,note:"E6"}, {freq:1567.9,note:"G6"}],
        [{freq:1174.6,note:"D6"}, {freq:1318.5,note:"E6"}, {freq:1567.9,note:"G6"}, {freq:1760.0,note:"A6"}, {freq:2093.0,note:"C7"}],

    ],
    blues: [
        [{freq:110.00,note:"A2"}, {freq:130.81,note:"C3"}, {freq:146.83,note:"D3"}, {freq:155.56,note:"D#3"},{freq:196.00,note:"G3"}],
        [{freq:155.56,note:"D#3"},{freq:196.00,note:"G3"}, {freq:220.00,note:"A3"}, {freq:261.63,note:"C4"}, {freq:293.66,note:"D4"}],
        [{freq:220.00,note:"A3"}, {freq:261.63,note:"C4"}, {freq:293.66,note:"D4"}, {freq:311.13,note:"D#4"},{freq:392.00,note:"G4"}],
        [{freq:311.13,note:"D#4"},{freq:392.00,note:"G4"}, {freq:440.00,note:"A4"}, {freq:523.25,note:"C5"}, {freq:587.33,note:"D5"}],
        [{freq:440.00,note:"A4"}, {freq:523.25,note:"C5"}, {freq:587.33,note:"D5"}, {freq:622.25,note:"D#5"},{freq:783.99,note:"G5"}],
        [{freq:622.25,note:"D#5"},{freq:783.99,note:"G5"}, {freq:880.00,note:"A5"}, {freq:1046.5,note:"C6"}, {freq:1174.6,note:"D6"}],
        [{freq:880.00,note:"A5"}, {freq:1046.5,note:"C6"}, {freq:1174.6,note:"D6"}, {freq:1244.5,note:"D#6"},{freq:1567.9,note:"G6"}],
        [{freq:1244.5,note:"D#6"},{freq:1567.9,note:"G6"}, {freq:1760.0,note:"A6"}, {freq:2093.0,note:"C7"}, {freq:2349.3,note:"D7"}]
    ]
};

const HUE_CODES = ["R", "O", "Y", "G", "C", "B", "P", "M"];
const HUE_BASE_COLORS = [
    [214, 54, 81],
    [214, 124, 54],
    [214, 182, 54],
    [54, 214, 91],
    [54, 214, 214],
    [54, 91, 214],
    [142, 54, 214],
    [214, 54, 182]
];

function toggleSpectrum() {
    document.getElementById("spectrum-drawer").classList.toggle("open");
}

function devSelectColor(r, g, b) {
    if (!devMode) return;
    document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
    processCameraTone(r, g, b);
}

function toggleDevMode() {
    devMode = !devMode;
    document.getElementById("dev-badge").classList.toggle("active", devMode);
    document.getElementById("dev-cam-panel").classList.toggle("active", devMode);
    
    if (!devMode && devStream) {
        stopWebcam();
        document.getElementById("dev-drawer").classList.remove("open");
    }
}

async function toggleWebcamDrawer() {
    const drawer = document.getElementById("dev-drawer");
    drawer.classList.toggle("open");
    webcamActive = drawer.classList.contains("open");

    if (webcamActive && !uploadedImage) {
        try {
            devStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
            const video = document.getElementById("dev-video");
            video.srcObject = devStream;
            video.play();
            updateCrosshairVisuals();
        } catch (err) {
            console.error("Webcam Access Error:", err);
        }
    } else if (!webcamActive) {
        stopWebcam();
    }
}

function stopWebcam() {
    if (devStream) {
        devStream.getTracks().forEach(track => track.stop());
        devStream = null;
    }
}

function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    stopWebcam();
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            uploadedImage = img;
            renderDevCanvas();
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

function continuousUpdateLoop() {
    let moved = false;

    if (activeKeys.w) { crosshairY = Math.max(0, crosshairY - STEP_SPEED); moved = true; }
    if (activeKeys.s) { crosshairY = Math.min(239, crosshairY + STEP_SPEED); moved = true; }
    if (activeKeys.a) { crosshairX = Math.max(0, crosshairX - STEP_SPEED); moved = true; }
    if (activeKeys.d) { crosshairX = Math.min(319, crosshairX + STEP_SPEED); moved = true; }

    if (devMode && webcamActive) {
        renderDevCanvas();
        if (moved) updateCrosshairVisuals();
    }

    requestAnimationFrame(continuousUpdateLoop);
}

function renderDevCanvas() {
    const canvas = document.getElementById("dev-canvas");
    const ctx = canvas.getContext("2d");

    if (uploadedImage) {
        ctx.drawImage(uploadedImage, 0, 0, 320, 240);
        sampleCanvasAt(Math.floor(crosshairX), Math.floor(crosshairY));
    } else {
        const video = document.getElementById("dev-video");
        if (video.readyState === 4) {
            ctx.drawImage(video, 0, 0, 320, 240);
            sampleCanvasAt(Math.floor(crosshairX), Math.floor(crosshairY));
        }
    }
}

function updateCrosshairVisuals() {
    document.getElementById("cross-h").style.top = `${crosshairY}px`;
    document.getElementById("cross-v").style.left = `${crosshairX}px`;
}

function sampleCanvasAt(x, y) {
    const canvas = document.getElementById("dev-canvas");
    const ctx = canvas.getContext("2d");
    try {
        const pixel = ctx.getImageData(x, y, 1, 1).data;
        const r = pixel[0];
        const g = pixel[1];
        const b = pixel[2];

        document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        processCameraTone(r, g, b);
    } catch (e) {}
}

function buildMatrixUI() {
    const container = document.getElementById("main-color-stacks");
    container.innerHTML = "";
    
    for (let h = 0; h < 8; h++) {
        const stack = document.createElement("div");
        stack.className = "hue-stack";

        for (let s = 4; s >= 0; s--) {
            const factor = 0.55 + (s * 0.11);
            const r = Math.round(HUE_BASE_COLORS[h][0] * factor);
            const g = Math.round(HUE_BASE_COLORS[h][1] * factor);
            const b = Math.round(HUE_BASE_COLORS[h][2] * factor);

            const item = document.createElement("div");
            item.className = "color-item";

            const sq = document.createElement("div");
            sq.className = "color-square";
            sq.id = `sq-${h}-${s}`;
            sq.style.backgroundColor = `rgb(${r},${g},${b})`;
            sq.onclick = () => devSelectColor(r, g, b);

            const label = document.createElement("span");
            label.id = `label-${h}-${s}`;
            label.innerText = `${HUE_CODES[h]}${s+1}:--`;

            item.appendChild(sq);
            item.appendChild(label);
            stack.appendChild(item);
        }
        container.appendChild(stack);
    }
}

function updateScaleLabels() {
    const scale = document.getElementById("scale-type").value;
    const matrix = MATRIX_SCALES[scale];
    
    document.getElementById("top-label-0").innerText = matrix[0][0].note;
    document.getElementById("top-label-1").innerText = matrix[2][0].note;
    document.getElementById("top-label-2").innerText = matrix[3][0].note;
    document.getElementById("top-label-3").innerText = matrix[4][0].note;
    document.getElementById("top-label-4").innerText = matrix[5][0].note;

    for (let h = 0; h < 8; h++) {
        for (let s = 0; s < 5; s++) {
            const label = document.getElementById(`label-${h}-${s}`);
            if (label) label.innerText = `${HUE_CODES[h]}${s+1}:${matrix[h][s].note}`;
        }
    }
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        camOsc = audioCtx.createOscillator();
        camGain = audioCtx.createGain();

        camOsc.type = document.getElementById("wave-type").value;
        camOsc.frequency.setValueAtTime(220, audioCtx.currentTime);

        camGain.gain.setValueAtTime(0.08, audioCtx.currentTime); 

        camOsc.connect(camGain);
        camGain.connect(audioCtx.destination);
        camOsc.start();
    }
}

function updateWaveform() {
    const wave = document.getElementById("wave-type").value;
    if (camOsc) {
        camOsc.type = wave;
    }
}

function processCameraTone(r, g, b) {
    initAudio();
    if (!camOsc || !camGain) return;

    let hueIndex = 0;
    if (r > 180 && g < 80 && b < 80) hueIndex = 0;
    else if (r > 180 && g >= 80 && g < 180 && b < 100) hueIndex = 1;
    else if (r > 150 && g > 150 && b < 100) hueIndex = 2;
    else if (g > r && g > b) hueIndex = 3;
    else if (g > 100 && b > 100 && r < 100) hueIndex = 4;
    else if (b > r && b > g && r < 100) hueIndex = 5;
    else if (r > 100 && b > 150 && g < 100) hueIndex = 6;
    else hueIndex = 7;

    const brightness = (r + g + b) / 3;
    const shadeIndex = Math.max(0, Math.min(4, Math.floor((brightness / 255) * 5)));

    document.querySelectorAll('.color-square, .color-indicator').forEach(el => el.classList.remove('active-shade'));
    
    const activeSq = document.getElementById(`sq-${hueIndex}-${shadeIndex}`);
    if (activeSq) activeSq.classList.add('active-shade');

    const topBarMap = { 0: 0, 2: 1, 3: 2, 4: 3, 5: 4 };
    if (topBarMap[hueIndex] !== undefined) {
        const topSq = document.getElementById(`top-sq-${topBarMap[hueIndex]}`);
        if (topSq) topSq.classList.add('active-shade');
    }

    const scaleKey = document.getElementById("scale-type").value;
    const targetNote = MATRIX_SCALES[scaleKey][hueIndex][shadeIndex];

    camOsc.frequency.setTargetAtTime(targetNote.freq, audioCtx.currentTime, 0.05);
}

function startTone(key) {
    initAudio();
    if (activeNotes[key]) return;

    const scale = document.getElementById("scale-type").value;
    const wave = document.getElementById("wave-type").value;
    const noteData = WASD_SCALES[scale][key.toUpperCase()];

    if (!noteData) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = wave;
    osc.frequency.setValueAtTime(noteData.freq, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();

    activeNotes[key] = { osc, gain };
}

function stopTone(key) {
    if (activeNotes[key]) {
        const { osc, gain } = activeNotes[key];
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        setTimeout(() => {
            try { osc.stop(); } catch(e){}
        }, 50);
        delete activeNotes[key];
    }
}

async function connect() {
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const encoder = new TextEncoderStream();
        encoder.readable.pipeTo(port.writable);
        writer = encoder.writable.getWriter();

        document.getElementById("status").innerText = "STATUS: CONNECTED";
        document.getElementById("connect-btn").style.display = "none";

        listenToSerial();

    } catch (err) {
        document.getElementById("status").innerText = "STATUS: FAILED";
    }
}

async function listenToSerial() {
    const textDecoder = new TextDecoderStream();
    port.readable.pipeTo(textDecoder.writable);
    reader = textDecoder.readable.getReader();

    let buffer = "";
    while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        
        buffer += value;
        let lines = buffer.split("\n");
        buffer = lines.pop();

        for (let line of lines) {
            line = line.trim();
            if (line.startsWith("RGB:")) {
                const parts = line.replace("RGB:", "").split(",");
                if (parts.length === 3) {
                    const r = parseInt(parts[0]);
                    const g = parseInt(parts[1]);
                    const b = parseInt(parts[2]);

                    document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
                    processCameraTone(r, g, b);
                }
            }
        }
    }
}

async function send(text) {
    if (writer) await writer.write(text);
}

function activate(key) {
    const btn = document.getElementById(key);
    if (btn) btn.classList.add("active");
    startTone(key);
}

function deactivate(key) {
    const btn = document.getElementById(key);
    if (btn) btn.classList.remove("active");
    stopTone(key);
}

document.addEventListener("keydown", async (e) => {
    if (e.ctrlKey && e.altKey && e.shiftKey && e.key.toLowerCase() === 'd') {
        toggleDevMode();
        return;
    }

    const key = e.key.toLowerCase();
    if (!["w","a","s","d"].includes(key)) return;
    
    if (!activeKeys[key]) {
        activeKeys[key] = true;
        activate(key);
        await send(key.toUpperCase() + "1");
    }
});

document.addEventListener("keyup", async (e) => {
    const key = e.key.toLowerCase();
    if (!["w","a","s","d"].includes(key)) return;
    
    activeKeys[key] = false;
    deactivate(key);
    await send(key.toUpperCase() + "0");
});

["w","a","s","d"].forEach(id => {
    const btn = document.getElementById(id);
    btn.addEventListener("mousedown", async () => { activeKeys[id] = true; activate(id); await send(id.toUpperCase() + "1"); });
    btn.addEventListener("mouseup", async () => { activeKeys[id] = false; deactivate(id); await send(id.toUpperCase() + "0"); });
    btn.addEventListener("mouseleave", async () => { activeKeys[id] = false; deactivate(id); await send(id.toUpperCase() + "0"); });
});

buildMatrixUI();
updateScaleLabels();
requestAnimationFrame(continuousUpdateLoop);
</script>
