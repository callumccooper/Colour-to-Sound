<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XY PLOTTER //</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            padding: 24px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
            gap: 25px;
            transition: background-color 0.25s ease;
        }

        .controls-top {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        #dev-badge {
            display: none;
            background: #fff;
            color: #000;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #dev-badge.active {
            display: inline-block;
        }

        .dev-cam-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid #fff;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
        }

        .dev-cam-panel.active {
            display: flex;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 0.8rem;
            font-weight: bold;
            gap: 12px;
        }

        .dev-content {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .dev-content.open {
            display: flex;
        }

        .canvas-container {
            position: relative;
            width: 320px;
            height: 240px;
            border: 1px solid #fff;
            overflow: hidden;
        }

        #dev-canvas {
            width: 320px;
            height: 240px;
            display: block;
        }

        .crosshair-h, .crosshair-v {
            position: absolute;
            background: #fff;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        .crosshair-h {
            height: 1px;
            width: 100%;
            top: 50%;
            left: 0;
        }

        .crosshair-v {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
        }

        .file-label {
            background: #fff;
            color: #000;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .dir-btn {
            width: 66px;
            height: 66px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            color: #fff;
            border: 1px solid #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .dir-btn.active {
            background: #fff;
            color: #000;
        }

        .synth-bar-wrapper {
            display: flex;
            flex-direction: column;
            border: 1px solid #fff;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
        }

        .synth-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 18px;
            font-size: 0.85rem;
        }

        .audio-drawer {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px 24px;
            padding: 14px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            align-items: center;
        }

        .audio-drawer.open {
            display: grid;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            height: 24px;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: #fff;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            height: 24px;
        }

        input[type="range"] {
            accent-color: #fff;
            cursor: pointer;
        }

        select, input[type="text"] {
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: 1px solid #fff;
            font-family: inherit;
            padding: 4px;
            text-transform: uppercase;
        }

        .scale-display {
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid #fff;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
        }

        .note-card {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .color-indicator {
            width: 14px;
            height: 14px;
            border: 1px solid #fff;
            cursor: pointer;
        }

        .toggle-btn {
            background: transparent;
            color: #fff;
            border: none;
            padding: 0 4px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-left: 6px;
        }

        .toggle-btn:hover {
            color: #aaa;
        }

        .expandable-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #fff;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            margin-top: -15px;
            position: relative;
        }

        .expandable-container.open {
            display: flex;
        }

        .grid-header {
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-align: center;
        }

        .stacks-container {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            justify-content: center;
        }

        .hue-stack {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        .color-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .color-square {
            width: 14px;
            height: 14px;
            border: 1px solid #fff;
            transition: transform 0.1s, border-color 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }

        .color-square.active-shade, .color-indicator.active-shade {
            border: 2px solid #000 !important;
            outline: 1px solid #fff;
            transform: scale(1.4);
            box-shadow: 0 0 10px #000;
        }

        .scale-edit-modal {
            display: none;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #fff;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            max-width: 90%;
            overflow-x: auto;
        }

        .scale-edit-modal.open {
            display: flex;
        }

        .edit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 4px;
        }

        .edit-inputs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-input-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.6rem;
        }

        .edit-input-item input {
            width: 36px;
            text-align: center;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div class="controls-top">
        <button id="connect-btn" onclick="connect()">CONNECT USB</button>
        <span id="status">STATUS: DISCONNECTED</span>
        <span id="dev-badge">DEV MODE: ACTIVE</span>
    </div>

    <div class="dev-cam-panel" id="dev-cam-panel">
        <div class="panel-header">
            <span>TEST</span>
            <button class="toggle-btn" onclick="toggleWebcamDrawer()">▼</button>
        </div>
        <div class="dev-content" id="dev-drawer">
            <div class="canvas-container" id="canvas-wrap">
                <canvas id="dev-canvas" width="320" height="240"></canvas>
                <div class="crosshair-h" id="cross-h"></div>
                <div class="crosshair-v" id="cross-v"></div>
            </div>
            <label class="checkbox-group" style="font-size:0.65rem; margin-top:4px;">
                <input type="checkbox" id="random-roam-mode" onchange="toggleRandomRoam()">
                <span>RANDOM ROAM (5S)</span>
            </label>
            <label class="file-label">
                UPLOAD IMAGE
                <input type="file" id="img-upload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
            </label>
            <video id="dev-video" autoplay playsinline style="display:none;"></video>
        </div>
    </div>

    <div class="dpad">
        <div class="row">
            <button id="w" class="dir-btn">W</button>
        </div>
        <div class="row">
            <button id="a" class="dir-btn">A</button>
            <button id="s" class="dir-btn">S</button>
            <button id="d" class="dir-btn">D</button>
        </div>
    </div>

    <div class="synth-bar-wrapper">
        <div class="synth-bar">
            <span>AUDIO:</span>
            <select id="wave-type" onchange="updateWaveform()">
                <option value="sine" selected>SINE</option>
                <option value="square">SQUARE</option>
                <option value="sawtooth">SAW</option>
                <option value="triangle">TRI</option>
            </select>

            <span>SCALE:</span>
            <select id="scale-type" onchange="updateScaleLabels()">
                <option value="minor" selected>MINOR PENTA (A)</option>
                <option value="major">MAJOR PENTA (C)</option>
                <option value="egyptian">EGYPTIAN</option>
                <option value="blues">BLUES PENTA</option>
            </select>
            <button class="toggle-btn" onclick="toggleAudioDrawer()">▼</button>
        </div>

        <div class="audio-drawer" id="audio-drawer">
            <label class="checkbox-group">
                <input type="checkbox" id="single-tone-mode">
                <span>SINGLE TONE MODE</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="vary-scale-repeat" checked>
                <span>VARY REPEAT SCALE</span>
            </label>

            <label class="checkbox-group">
                <input type="checkbox" id="mute-wasd-tones">
                <span>MUTE WASD TONES</span>
            </label>
            <div></div>

            <div class="slider-group">
                <span>SPEED OF SCALE:</span>
                <input type="range" id="scale-speed" min="0.05" max="1.0" step="0.05" value="0.20">
            </div>
            <div class="slider-group">
                <span>SCALE LENGTH:</span>
                <input type="range" id="scale-length" min="3" max="12" step="1" value="8" onchange="updateScaleLengthUI()">
            </div>

            <div class="slider-group">
                <span>PITCH SHIFT:</span>
                <input type="range" id="master-pitch-shift" min="-2400" max="1200" step="100" value="-2400" onchange="updateMasterPitch()">
            </div>
            <div class="slider-group">
                <span>GLIDE SPEED:</span>
                <input type="range" id="glide-speed" min="0.01" max="0.5" step="0.01" value="0.01">
            </div>

            <div class="slider-group">
                <span>FILTER CUTOFF:</span>
                <input type="range" id="filter-cutoff" min="200" max="8000" step="100" value="3000" onchange="updateFilter()">
            </div>
            <div class="slider-group">
                <span>MASTER VOL:</span>
                <input type="range" id="master-vol" min="0.01" max="0.3" step="0.01" value="0.08" onchange="updateCamToneVol()">
            </div>

            <div class="slider-group">
                <span>HARMONIC DETUNE:</span>
                <input type="range" id="detune-val" min="0" max="25" step="1" value="5" onchange="updateDetune()">
            </div>
            <div class="slider-group">
                <span>REVERB REFLECT:</span>
                <input type="range" id="reverb-val" min="0" max="0.8" step="0.05" value="0.3" onchange="updateReverb()">
            </div>
        </div>
    </div>

    <div class="scale-display">
        <div class="note-card">
            <div class="color-indicator" id="top-sq-0" style="background:#d63651;" onclick="devSelectColor(214, 54, 81)"></div>
            <span>R: <span id="top-label-0">A2</span></span>
        </div>
        <div class="note-card">
            <div class="color-indicator" id="top-sq-1" style="background:#d6b636;" onclick="devSelectColor(214, 182, 54)"></div>
            <span>Y: <span id="top-label-1">A3</span></span>
        </div>
        <div class="note-card">
            <div class="color-indicator" id="top-sq-2" style="background:#36d65b;" onclick="devSelectColor(54, 214, 91)"></div>
            <span>G: <span id="top-label-2">A4</span></span>
        </div>
        <div class="note-card">
            <div class="color-indicator" id="top-sq-3" style="background:#36d6d6;" onclick="devSelectColor(54, 214, 214)"></div>
            <span>C: <span id="top-label-3">A5</span></span>
        </div>
        <div class="note-card">
            <div class="color-indicator" id="top-sq-4" style="background:#365bd6;" onclick="devSelectColor(54, 91, 214)"></div>
            <span>B: <span id="top-label-4">D5</span></span>
        </div>
        <button class="toggle-btn" onclick="toggleSpectrum()">▼</button>
    </div>

    <div class="expandable-container" id="spectrum-drawer">
        <div class="grid-header">COLOUR TO SOUND</div>
        <div class="stacks-container" id="main-color-stacks"></div>

        <div class="scale-edit-modal" id="scale-modal">
            <div class="edit-header">
                <span id="modal-title">EDIT SCALE // [RED 1]</span>
                <button class="toggle-btn" onclick="closeScaleModal()">✕</button>
            </div>
            <div class="slider-group" style="font-size:0.65rem;">
                <span>HUE SCALE PITCH (SEMITONES):</span>
                <input type="range" id="modal-pitch-offset" min="-24" max="24" step="1" value="0" oninput="updateHuePitch(this.value)">
                <span id="modal-pitch-label">0</span>
            </div>
            <div class="edit-inputs" id="modal-inputs"></div>
        </div>
    </div>

function toggleDevMode() {
    devMode = !devMode;

    document.getElementById("dev-cam-panel").classList.toggle("active", devMode);
    
    if (!devMode && devStream) {

async function toggleWebcamDrawer() {
    const drawer = document.getElementById("dev-drawer");
    drawer.classList.toggle("open");
    webcamActive = drawer.classList.contains("open");

    if (webcamActive && !uploadedImage) {
        try {
            devStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
            const video = document.getElementById("dev-video");
            video.srcObject = devStream;
            video.play();
            updateCrosshairVisuals();
        } catch (err) {
            console.error("Webcam Access Error:", err);
        }
    } else if (!webcamActive) {
        stopWebcam();
        resetToBlack();
    }
}

function stopWebcam() {
    if (devStream) {
        devStream.getTracks().forEach(track => track.stop());
        devStream = null;
    }
}

function resetToBlack() {
    document.body.style.backgroundColor = "#000000";
    lastSampledRGB = "";
}

function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    stopWebcam();
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            uploadedImage = img;
            renderDevCanvas();
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

function toggleRandomRoam() {
    const isRoam = document.getElementById("random-roam-mode").checked;
    if (isRoam) {
        if (randomRoamTimer) clearInterval(randomRoamTimer);
        randomRoamTimer = setInterval(() => {
            if (!activeKeys.w && !activeKeys.a && !activeKeys.s && !activeKeys.d) {
                targetCrosshairX = Math.floor(Math.random() * 320);
                targetCrosshairY = Math.floor(Math.random() * 240);
            }
        }, 5000);
    } else {
        if (randomRoamTimer) {
            clearInterval(randomRoamTimer);
            randomRoamTimer = null;
        }
    }
}

function continuousUpdateLoop() {
    let moved = false;

    if (activeKeys.w) { crosshairY = Math.max(0, crosshairY - STEP_SPEED); targetCrosshairY = crosshairY; moved = true; }
    if (activeKeys.s) { crosshairY = Math.min(239, crosshairY + STEP_SPEED); targetCrosshairY = crosshairY; moved = true; }
    if (activeKeys.a) { crosshairX = Math.max(0, crosshairX - STEP_SPEED); targetCrosshairX = crosshairX; moved = true; }
    if (activeKeys.d) { crosshairX = Math.min(319, crosshairX + STEP_SPEED); moved = true; }

    if (!moved && (crosshairX !== targetCrosshairX || crosshairY !== targetCrosshairY)) {
        if (crosshairX < targetCrosshairX) crosshairX = Math.min(targetCrosshairX, crosshairX + STEP_SPEED);
        if (crosshairX > targetCrosshairX) crosshairX = Math.max(targetCrosshairX, crosshairX - STEP_SPEED);
        if (crosshairY < targetCrosshairY) crosshairY = Math.min(targetCrosshairY, crosshairY + STEP_SPEED);
        if (crosshairY > targetCrosshairY) crosshairY = Math.max(targetCrosshairY, crosshairY - STEP_SPEED);
        moved = true;
    }

    if (devMode && webcamActive) {
        renderDevCanvas();
        if (moved) updateCrosshairVisuals();
    }

    requestAnimationFrame(continuousUpdateLoop);
}

function renderDevCanvas() {
    const canvas = document.getElementById("dev-canvas");
    const ctx = canvas.getContext("2d");

    if (uploadedImage) {
        ctx.drawImage(uploadedImage, 0, 0, 320, 240);
        sampleCanvasAt(Math.floor(crosshairX), Math.floor(crosshairY));
    } else {
        const video = document.getElementById("dev-video");
        if (video.readyState === 4) {
            ctx.drawImage(video, 0, 0, 320, 240);
            sampleCanvasAt(Math.floor(crosshairX), Math.floor(crosshairY));
        }
    }
}

function updateCrosshairVisuals() {
    document.getElementById("cross-h").style.top = `${crosshairY}px`;
    document.getElementById("cross-v").style.left = `${crosshairX}px`;
}

function sampleCanvasAt(x, y) {
    const canvas = document.getElementById("dev-canvas");
    const ctx = canvas.getContext("2d");
    try {
        const pixel = ctx.getImageData(x, y, 1, 1).data;
        const r = pixel[0];
        const g = pixel[1];
        const b = pixel[2];

        const rgbStr = `${r},${g},${b}`;
        document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        
        if (rgbStr !== lastSampledRGB) {
            lastSampledRGB = rgbStr;
            processCameraTone(r, g, b);
        }
    } catch (e) {}
}

    const b = Math.round(HUE_BASE_COLORS[h][2] * factor);
    document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;

    title.innerText = `EDIT SCALE // [${HUE_CODES[h]}${s+1}]`;

    document.getElementById("modal-pitch-label").innerText = pitchOffset > 0 ? `+${pitchOffset}` : pitchOffset;

function renderModalInputFields() {
    const container = document.getElementById("modal-inputs");
    container.innerHTML = "";

    const scaleKey = document.getElementById("scale-type").value;
    const maxLen = parseInt(document.getElementById("scale-length").value);
    const currentScale = customNoteOverrides[activeEditKey] || MATRIX_SCALES[scaleKey][activeEditHue].slice(0, maxLen).map(item => item.note);

    for (let i = 0; i < maxLen; i++) {
        const wrap = document.createElement("div");
        wrap.className = "edit-input-item";

        const lbl = document.createElement("span");
        lbl.innerText = `N${i+1}`;

        const input = document.createElement("input");
        input.type = "text";
        input.value = currentScale[i] || "A4";
        input.onchange = (e) => {
            const val = e.target.value.toUpperCase();
            if (NOTE_FREQS[val]) {
                if (!customNoteOverrides[activeEditKey]) {
                    customNoteOverrides[activeEditKey] = [...currentScale];
                }
                customNoteOverrides[activeEditKey][i] = val;
            }
        };

        wrap.appendChild(lbl);
        wrap.appendChild(input);

}

function closeScaleModal() {

    activeEditKey = null;

        clearInterval(modalLoopTimer);

    }
    resetToBlack();

function startModalLoop(h, s) {
    if (modalLoopTimer) clearInterval(modalLoopTimer);
    
    let modalPos = 0;
    let modalDir = 1;

    const playStep = () => {
        initAudio();
        const scaleKey = document.getElementById("scale-type").value;
        const maxLen = parseInt(document.getElementById("scale-length").value);
        const currentScale = customNoteOverrides[`${h}-${s}`] || MATRIX_SCALES[scaleKey][h].slice(0, maxLen).map(item => item.note);
        
        const isSingleTone = document.getElementById("single-tone-mode").checked;
        const isVaryMode = document.getElementById("vary-scale-repeat").checked;

        let noteName;
        if (isSingleTone) {
            noteName = currentScale[0];
        } else {
            noteName = currentScale[modalPos % currentScale.length];

            const stepSize = Math.random() < 0.3 ? 2 : 1;
            modalPos += modalDir * stepSize;

            if (modalPos >= currentScale.length - 1) {
                modalPos = currentScale.length - 1;
                modalDir = -1;
            } else if (modalPos <= 0) {
                modalPos = 0;
                modalDir = 1;
            } else if (isVaryMode && Math.random() < 0.25) {
                modalDir *= -1;
            }
        }

        let freq = NOTE_FREQS[noteName] || 440;
        const semitoneShift = huePitchOffsets[h] || 0;
        freq = freq * Math.pow(2, semitoneShift / 12);

        applyFrequencyGainCompensation(freq);

        const glideSpeed = parseFloat(document.getElementById("glide-speed").value);
        camOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, glideSpeed);
        camOsc2.frequency.setTargetAtTime(freq, audioCtx.currentTime, glideSpeed);
    };

    playStep();
    const speedMs = parseFloat(document.getElementById("scale-speed").value) * 1000;
    modalLoopTimer = setInterval(playStep, speedMs);
}

function makeDistortionCurve(amount = 20) {
    const k = amount;
    const n_samples = 44100;
    const curve = new Float32Array(n_samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < n_samples; ++i) {
        let x = (i * 2) / n_samples - 1;
        curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
    }
    return curve;
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        camOsc = audioCtx.createOscillator();
        camOsc2 = audioCtx.createOscillator();
        camFilter = audioCtx.createBiquadFilter();
        waveShaper = audioCtx.createWaveShaper();
        camGain = audioCtx.createGain();
        reverbGain = audioCtx.createGain();

        const wave = document.getElementById("wave-type").value;
        camOsc.type = wave;
        camOsc2.type = wave;

        // Soft saturation drive for warm fundamental harmonics
        waveShaper.curve = makeDistortionCurve(5);
        waveShaper.oversample = '4x';

        // Resonant lowpass filter to make sine and triangle fundamentals pop on small speakers
        camFilter.type = "lowpass";
        camFilter.Q.setValueAtTime(2.5, audioCtx.currentTime);
        const cutoffFreq = parseFloat(document.getElementById("filter-cutoff").value);
        camFilter.frequency.setValueAtTime(cutoffFreq, audioCtx.currentTime);

        const shiftCents = parseFloat(document.getElementById("master-pitch-shift").value);
        const detuneVal = parseFloat(document.getElementById("detune-val").value);
        
        camOsc.detune.setValueAtTime(shiftCents, audioCtx.currentTime);
        camOsc2.detune.setValueAtTime(shiftCents + detuneVal, audioCtx.currentTime);

        const targetVol = parseFloat(document.getElementById("master-vol").value);
        camGain.gain.setValueAtTime(targetVol, audioCtx.currentTime); 

        const revVal = parseFloat(document.getElementById("reverb-val").value);
        reverbGain.gain.setValueAtTime(revVal, audioCtx.currentTime);

        camOsc.connect(waveShaper);
        camOsc2.connect(waveShaper);
        waveShaper.connect(camFilter);
        camFilter.connect(camGain);
        camGain.connect(audioCtx.destination);

        camOsc.start();
        camOsc2.start();

        startScaleSequencer();
    }
}

// Frequency-proportional Gain Boost Curve
function applyFrequencyGainCompensation(freq) {
    if (!camGain || !audioCtx) return;

    const baseVol = parseFloat(document.getElementById("master-vol").value);
    const wave = document.getElementById("wave-type").value;

    if (wave === "sine" || wave === "triangle") {
        // Boost gain for lower pitches (Red, Orange, Yellow) up to 4.5x base volume
        const boostFactor = Math.max(1.0, Math.min(4.5, 1200 / Math.max(freq, 40)));
        camGain.gain.setTargetAtTime(baseVol * boostFactor, audioCtx.currentTime, 0.05);
    } else {
        camGain.gain.setTargetAtTime(baseVol, audioCtx.currentTime, 0.05);
    }
}

function startScaleSequencer() {
    if (scaleSequenceTimer) clearInterval(scaleSequenceTimer);

    let mainPos = 0;
    let mainDir = 1;

    const stepNote = () => {
        if (!audioCtx || currentScaleNotes.length === 0 || activeEditKey) return;

        const isSingleTone = document.getElementById("single-tone-mode").checked;
        const isVaryMode = document.getElementById("vary-scale-repeat").checked;
        
        let noteName;
        if (isSingleTone) {
            noteName = currentScaleNotes[0];
        } else {
            noteName = currentScaleNotes[mainPos % currentScaleNotes.length];

            const stepSize = Math.random() < 0.35 ? 2 : 1;
            mainPos += mainDir * stepSize;

            if (mainPos >= currentScaleNotes.length - 1) {
                mainPos = currentScaleNotes.length - 1;
                mainDir = -1;
            } else if (mainPos <= 0) {
                mainPos = 0;
                mainDir = 1;
            } else if (isVaryMode && Math.random() < 0.25) {
                mainDir *= -1;
            }
        }

        let freq = NOTE_FREQS[noteName] || 440;
        
        if (lastMatchedHue !== -1 && huePitchOffsets[lastMatchedHue]) {
            const shift = huePitchOffsets[lastMatchedHue];
            freq = freq * Math.pow(2, shift / 12);
        }

        applyFrequencyGainCompensation(freq);

        const glideSpeed = parseFloat(document.getElementById("glide-speed").value);
        camOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, glideSpeed);
        camOsc2.frequency.setTargetAtTime(freq, audioCtx.currentTime, glideSpeed);
    };

    const speedMs = parseFloat(document.getElementById("scale-speed").value) * 1000;
    scaleSequenceTimer = setInterval(stepNote, speedMs);
}

document.getElementById("scale-speed").addEventListener("input", () => {
    if (audioCtx) startScaleSequencer();
});

let lastMatchKey = "";
let lastMatchedHue = -1;

function processCameraTone(r, g, b) {
    if (activeEditKey) return; 

    initAudio();
    if (!camOsc || !camGain) return;

    let closestHue = 0;
    let closestShade = 0;
    let minDistance = Infinity;

    for (let h = 0; h < 8; h++) {
        for (let s = 0; s < 5; s++) {
            const factor = 0.55 + (s * 0.11);
            const targetR = Math.round(HUE_BASE_COLORS[h][0] * factor);
            const targetG = Math.round(HUE_BASE_COLORS[h][1] * factor);
            const targetB = Math.round(HUE_BASE_COLORS[h][2] * factor);

            const dist = Math.sqrt(
                Math.pow(r - targetR, 2) +
                Math.pow(g - targetG, 2) +
                Math.pow(b - targetB, 2)
            );

            if (dist < minDistance) {
                minDistance = dist;
                closestHue = h;
                closestShade = s;
            }
        }
    }

    lastMatchKey = `${closestHue}-${closestShade}`;
    lastMatchedHue = closestHue;

    document.querySelectorAll('.color-square, .color-indicator').forEach(el => el.classList.remove('active-shade'));
    const activeSq = document.getElementById(`sq-${closestHue}-${closestShade}`);
    if (activeSq) activeSq.classList.add('active-shade');

    const topBarMap = { 0: 0, 2: 1, 3: 2, 4: 3, 5: 4 };
    if (topBarMap[closestHue] !== undefined) {
        const topSq = document.getElementById(`top-sq-${topBarMap[closestHue]}`);
        if (topSq) topSq.classList.add('active-shade');
    }

    const scaleKey = document.getElementById("scale-type").value;
    const maxScaleLen = parseInt(document.getElementById("scale-length").value);

    if (customNoteOverrides[lastMatchKey]) {
        currentScaleNotes = customNoteOverrides[lastMatchKey].slice(0, maxScaleLen);
    } else {
        currentScaleNotes = MATRIX_SCALES[scaleKey][closestHue].slice(0, maxScaleLen).map(item => item.note);
    }

    if (closestHue !== lastHueIndex) {
        lastHueIndex = closestHue;
    }
}

function startTone(key) {
    const isMuted = document.getElementById("mute-wasd-tones").checked;
    if (isMuted) return;

    initAudio();
    if (activeNotes[key]) return;

    const scale = document.getElementById("scale-type").value;
    const wave = document.getElementById("wave-type").value;
    const noteData = WASD_SCALES[scale][key.toUpperCase()];

    if (!noteData) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = wave;
    osc.frequency.setValueAtTime(noteData.freq, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();

    activeNotes[key] = { osc, gain };
}

function stopTone(key) {
    if (activeNotes[key]) {
        const { osc, gain } = activeNotes[key];
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        setTimeout(() => {
            try { osc.stop(); } catch(e){}
        }, 50);
        delete activeNotes[key];
    }
}

async function connect() {
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const encoder = new TextEncoderStream();
        encoder.readable.pipeTo(port.writable);
        writer = encoder.writable.getWriter();

        document.getElementById("status").innerText = "STATUS: CONNECTED";
        document.getElementById("connect-btn").style.display = "none";

        listenToSerial();

    } catch (err) {
        document.getElementById("status").innerText = "STATUS: FAILED";
    }
}

async function listenToSerial() {
    const textDecoder = new TextDecoderStream();
    port.readable.pipeTo(textDecoder.writable);
    reader = textDecoder.readable.getReader();

    let buffer = "";
    while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        
        buffer += value;
        let lines = buffer.split("\n");
        buffer = lines.pop();

        for (let line of lines) {
            line = line.trim();
            if (line.startsWith("RGB:")) {
                const parts = line.replace("RGB:", "").split(",");
                if (parts.length === 3) {
                    const r = parseInt(parts[0]);
                    const g = parseInt(parts[1]);
                    const b = parseInt(parts[2]);

                    document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
                    processCameraTone(r, g, b);
                }
            }
        }
    }
}

async function send(text) {
    if (writer) await writer.write(text);
}

function activate(key) {
    const btn = document.getElementById(key);
    if (btn) btn.classList.add("active");
    startTone(key);
}

function deactivate(key) {
    const btn = document.getElementById(key);
    if (btn) btn.classList.remove("active");
    stopTone(key);
}

document.addEventListener("keydown", async (e) => {
    if (e.ctrlKey && e.altKey && e.shiftKey && e.key.toLowerCase() === 'd') {
        toggleDevMode();
        return;
    }

    const key = e.key.toLowerCase();
    if (!["w","a","s","d"].includes(key)) return;
    
    if (!activeKeys[key]) {
        activeKeys[key] = true;
        activate(key);
        await send(key.toUpperCase() + "1");
    }
});

document.addEventListener("keyup", async (e) => {
    const key = e.key.toLowerCase();
    if (!["w","a","s","d"].includes(key)) return;
    
    activeKeys[key] = false;
    deactivate(key);
    await send(key.toUpperCase() + "0");
});

["w","a","s","d"].forEach(id => {
    const btn = document.getElementById(id);
    btn.addEventListener("mousedown", async () => { activeKeys[id] = true; activate(id); await send(id.toUpperCase() + "1"); });
    btn.addEventListener("mouseup", async () => { activeKeys[id] = false; deactivate(id); await send(id.toUpperCase() + "0"); });
    btn.addEventListener("mouseleave", async () => { activeKeys[id] = false; deactivate(id); await send(id.toUpperCase() + "0"); });
});

buildMatrixUI();
updateScaleLabels();
requestAnimationFrame(continuousUpdateLoop);
</script>
